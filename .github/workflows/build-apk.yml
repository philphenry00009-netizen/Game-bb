name: Build GameBoost APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q GameBoost.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: GameBoost
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: GameBoost-apk
          path: GameBoost/app/build/outputs/apk/release/*.apk
